name: Rebuild Dashboard

# Manual trigger only — gives you a "Run workflow" button in the GitHub UI
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you rebuilding? (optional note)'
        required: false
        default: 'Manual refresh'
  schedule:
    - cron: '0 22 * * *'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl numpy google-api-python-client google-auth

      - name: Download Excel and rebuild JSON
        env:
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          OUTPUT_DIR: public
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build.py
            if [ -z "$(git status --porcelain public/projects.json)" ]; then
              echo "No changes to commit"
              exit 0
            fi
            git add public/projects.json
            git commit -m "Rebuild dashboard data ($(date -u +%Y-%m-%d_%H:%M))"
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push $attempt failed, retrying in 8s..."
            sleep 8
          done
          echo "All attempts failed"
          exit 1
